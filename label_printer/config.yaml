name: Label Printer
version: "1.2.0"
slug: label_printer
description: >
  Print labels on a Brother PT-P750W via a simple HTTP API.
  Works with HA Assist voice commands, rest_command, and dashboard buttons.
url: https://github.com/warinthestars/BrotherPTouch-PT-750w-HA-Control
arch:
  - aarch64
  - amd64
  - armhf
  - armv7
  - i386
ports:
  8765/tcp: 8765
ports_description:
  8765/tcp: Label print HTTP API
# options provides defaults shown in the HA UI.
options:
  printer_ip: "192.168.1.100"
  printer_port: 9100
  tape_width_mm: 24
  font_size: 40
  date_format: "Jan 2, 2006"
  time_format: "3:04 PM"
  auto_tape_width: true
  log_level: "info"
schema:
  printer_ip: str
  printer_port: int
  tape_width_mm: int
  font_size: int
  # Go time layouts (https://pkg.go.dev/time#pkg-constants), e.g.
  # "Jan 2, 2006" → Jul 1, 2026 · "2006-01-02" → 2026-07-01 · "01/02/06" → 07/01/26
  date_format: str
  time_format: str
  # When true, the tape width loaded in the printer is detected before each
  # print and overrides tape_width_mm (prevents size-mismatch errors).
  auto_tape_width: bool
  # info = startup, prints, errors. debug = + every HTTP request, printer
  # dial/status detail, and raw ptouchgo protocol tracing.
  log_level: list(info|debug)
